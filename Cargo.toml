[workspace]
members = [
    "crates/common",
    "crates/config",
    "crates/backend",
    "crates/tokenizer",
    "crates/cache",
    "crates/moe",
    "crates/io",
    "crates/gguf",
    "crates/model",
    "crates/runtime",
    "crates/server",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
metal = "0.29.0"
objc = "0.2.7"
libc = "0.2"
memmap2 = "0.9"
rayon = "1.12"
rustix = { version = "1.1.4", features = ["termios"] }
safetensors = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokenizers = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
